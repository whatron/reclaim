name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Reclaim.app
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the app
        run: |
          set -o pipefail
          ./build.sh --no-open 2>&1 | tee build.log

      - name: Publish compiler messages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          # Errors first (with the notes that follow them), then warnings, without duplicates.
          grep -E ": (error|warning|note): " build.log | sed "s|$GITHUB_WORKSPACE/||" | awk '!seen[$0]++' > messages.txt || true
          errors=$(grep -c ": error: " messages.txt || true)
          warnings=$(grep -c ": warning: " messages.txt || true)
          { grep ": error: " messages.txt || true; grep -v ": error: " messages.txt || true; } | head -c 60000 > report.txt
          {
            echo "Errors: $errors, warnings: $warnings"
            echo
            echo '```'
            xcodebuild -version
            swift --version 2>&1 | head -2
            echo '```'
          } > summary.md
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="Compiler messages" \
            -f head_sha="${{ github.sha }}" \
            -f status=completed \
            -f conclusion=neutral \
            -f "output[title]=$errors errors, $warnings warnings" \
            -F "output[summary]=@summary.md" \
            -F "output[text]=@report.txt" > /dev/null || echo "Couldn't publish the compiler messages."

      - name: Zip the app
        run: ditto -c -k --keepParent build/Reclaim.app build/Reclaim.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Reclaim-app
          path: build/Reclaim.zip
          retention-days: 14

      # Commit messages containing [screenshots] also photograph every page and push the
      # pictures to the `screenshots` branch.
      - name: Set up demo projects
        if: contains(github.event.head_commit.message, '[screenshots]')
        run: ./Scripts/demo_projects.sh

      - name: Take screenshots
        if: contains(github.event.head_commit.message, '[screenshots]')
        run: ./Scripts/screenshot_tour.sh shots

      - name: Publish screenshots
        if: contains(github.event.head_commit.message, '[screenshots]')
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots of ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
