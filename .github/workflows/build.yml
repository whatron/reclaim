name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

# A newer push cancels an older build on the same branch, except on main, where every merge
# gets a complete build (back-to-back merges used to leave cancelled runs on main).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build Reclaim.app
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Extras requested in a commit message. They never run on main and never fail the build.
      SHOTS: ${{ github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[screenshots]') }}
      APP: ${{ github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[app]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version number counts commits

      # VERSION holds the release number, e.g. 0.1.0. The first build of it on main becomes
      # that release. Every other build gets a label: 0.1.0-build.31 on main,
      # 0.1.0-build.31.my-branch elsewhere.
      - name: Work out the version
        run: |
          base="$(cat VERSION)"
          count="$(git rev-list --count HEAD)"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null 2>&1; then
              version="$base-build.$count"
            else
              version="$base"
              release=true
            fi
          else
            version="$base-build.$count.$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9' '-')"
          fi
          echo "RECLAIM_VERSION=$version" >> "$GITHUB_ENV"
          echo "RECLAIM_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Version $version (release: $release)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the app
        run: |
          set -o pipefail
          ./build.sh --no-open 2>&1 | tee build.log

      - name: Publish compiler messages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          # Errors first (with the notes that follow them), then warnings, without duplicates.
          grep -E ": (error|warning|note): " build.log | sed "s|$GITHUB_WORKSPACE/||" | awk '!seen[$0]++' > messages.txt || true
          errors=$(grep -c ": error: " messages.txt || true)
          warnings=$(grep -c ": warning: " messages.txt || true)
          { grep ": error: " messages.txt || true; grep -v ": error: " messages.txt || true; } | head -c 60000 > report.txt
          {
            echo "Errors: $errors, warnings: $warnings"
            echo
            echo '```'
            xcodebuild -version
            swift --version 2>&1 | head -2
            echo '```'
          } > summary.md
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="Compiler messages" \
            -f head_sha="${{ github.sha }}" \
            -f status=completed \
            -f conclusion=neutral \
            -f "output[title]=$errors errors, $warnings warnings" \
            -F "output[summary]=@summary.md" \
            -F "output[text]=@report.txt" > /dev/null || echo "Couldn't publish the compiler messages."

      - name: Zip the app
        run: |
          ditto -c -k --keepParent build/Reclaim.app "build/Reclaim-$RECLAIM_VERSION.zip"
          cp "build/Reclaim-$RECLAIM_VERSION.zip" build/Reclaim.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Reclaim-${{ env.RECLAIM_VERSION }}
          path: build/Reclaim-${{ env.RECLAIM_VERSION }}.zip
          retention-days: 14

      # A new number in VERSION, merged to main, becomes a release with the app attached.
      # Releases are kept for good; build artifacts expire after 14 days.
      - name: Publish a release
        if: github.ref == 'refs/heads/main' && env.RECLAIM_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ### Install
          1. Download **Reclaim-VERSION.zip** below and double-click it.
          2. Drag **Reclaim** into Applications, replacing any older copy.
          3. First time only: open it, then go to **System Settings → Privacy & Security** and click **Open Anyway** (the app isn't notarized).

          For Apple-silicon Macs. On an Intel Mac, build from source with `./build.sh --install`.
          NOTES
          sed -i '' "s/VERSION/$RECLAIM_VERSION/" notes.md
          gh release create "v$RECLAIM_VERSION" "build/Reclaim-$RECLAIM_VERSION.zip" \
            --title "Reclaim $RECLAIM_VERSION" --notes-file notes.md --generate-notes \
            --target "$GITHUB_SHA" --latest

      - name: Summary
        if: always()
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            if [ -f "build/Reclaim-$RECLAIM_VERSION.zip" ]; then
              echo "## ✅ Reclaim $RECLAIM_VERSION built"
            else
              echo "## ❌ Reclaim $RECLAIM_VERSION didn't build"
              echo
              echo "See the **Compiler messages** check for the errors."
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | **$RECLAIM_VERSION** |"
            echo "| Commit | [\`${GITHUB_SHA::7}\`]($repo/commit/$GITHUB_SHA) on \`$GITHUB_REF_NAME\` |"
            echo "| Built with | $(xcodebuild -version | head -1) on $(sw_vers -productName) $(sw_vers -productVersion) |"
            if [ -f "build/Reclaim-$RECLAIM_VERSION.zip" ]; then
              if [ "$RECLAIM_RELEASE" = "true" ]; then
                echo "| Download | [Reclaim-$RECLAIM_VERSION.zip on the release page]($repo/releases/tag/v$RECLAIM_VERSION) |"
              else
                echo "| Download | **Reclaim-$RECLAIM_VERSION** under *Artifacts* at the bottom of this page (kept 14 days) |"
              fi
            fi
            echo
            echo "Latest release, always: $repo/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"

      # Commit messages containing [screenshots] also photograph every page and push the
      # pictures to the `screenshots` branch.
      - name: Set up demo projects
        if: env.SHOTS == 'true'
        continue-on-error: true
        run: ./Scripts/demo_projects.sh

      - name: Take screenshots
        if: env.SHOTS == 'true'
        continue-on-error: true
        run: ./Scripts/screenshot_tour.sh shots

      - name: Report the tour
        if: always() && env.SHOTS == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Screenshots"; ls -la shots 2>&1 || true
            echo "## Timings"; cat build/tour/timings.txt 2>&1 || true
            echo; echo "## The old way: measuring a folder each time it opens"
            for d in "$HOME" "$HOME/Library" "$HOME/hostedtoolcache"; do
              s=$(python3 -c "import time;print(time.time())")
              /usr/bin/du -k -d 2 -x "$d" > /dev/null 2>&1
              e=$(python3 -c 'import time;print(time.time())')
              python3 -c "print('du -d 2 ${d/$HOME/~}: %.2f s' % ($e - $s))"
            done
            echo; echo "## Tour folder"; ls -la build/tour 2>&1 || true; cat build/tour/now 2>&1 || true
            echo; echo "## Crash reports"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/Reclaim* 2>/dev/null | head -2); do
              echo "### $f"; head -c 12000 "$f"; echo
            done
          } > tour.txt
          head -c 60000 tour.txt > tour-short.txt
          # The tour doubles as a smoke test: a crash is a real bug, so that check turns red.
          shots=$(ls shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          if ls ~/Library/Logs/DiagnosticReports/Reclaim* >/dev/null 2>&1; then
            conclusion=failure; title="Reclaim crashed during the tour ($shots screenshots)"
          else
            conclusion=success; title="$shots screenshots, no crashes"
          fi
          gh api "repos/${{ github.repository }}/check-runs" -f name="Screenshot tour" \
            -f head_sha="${{ github.sha }}" -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" -f "output[summary]=$title" -F "output[text]=@tour-short.txt" > /dev/null || true

      - name: Publish screenshots
        if: env.SHOTS == 'true'
        continue-on-error: true
        run: |
          ls shots/*.png >/dev/null 2>&1 || { echo "No screenshots to publish."; exit 0; }
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots of ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

      # Commit messages containing [app] also push the built app to the `app-build` branch.
      - name: Publish the app
        if: env.APP == 'true'
        continue-on-error: true
        run: |
          mkdir -p out && cp build/Reclaim.zip out/
          cd out
          git init -q -b app-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Reclaim.app built from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" app-build
